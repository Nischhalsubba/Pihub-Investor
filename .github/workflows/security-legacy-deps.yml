name: Legacy dependency security validation

on:
  push:
    branches:
      - agent/security-legacy-deps
    paths:
      - package.json
      - src/actions/index.js
      - .github/workflows/security-legacy-deps.yml

permissions:
  contents: write

jobs:
  validate-and-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/security-legacy-deps
          fetch-depth: 0

      - name: Set up Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Use npm 6 for lockfile v1 compatibility
        id: npm6
        continue-on-error: true
        run: npm install --global npm@6.14.18

      - name: Regenerate lockfile
        id: lock
        if: steps.npm6.outcome == 'success'
        continue-on-error: true
        run: npm install --package-lock-only --ignore-scripts

      - name: Install from regenerated lockfile
        id: install
        if: steps.lock.outcome == 'success'
        continue-on-error: true
        run: npm ci

      - name: Run tests
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          CI: true
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build
        id: build
        if: steps.tests.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - name: Commit validated lockfile
        if: steps.npm6.outcome == 'success' && steps.lock.outcome == 'success' && steps.install.outcome == 'success' && steps.tests.outcome == 'success' && steps.build.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate lockfile for legacy security updates"
            git push origin HEAD:agent/security-legacy-deps
          fi

      - name: Record validation status
        if: always()
        run: |
          printf 'npm6=%s\nlock=%s\ninstall=%s\ntests=%s\nbuild=%s\n' \
            "${{ steps.npm6.outcome }}" \
            "${{ steps.lock.outcome }}" \
            "${{ steps.install.outcome }}" \
            "${{ steps.tests.outcome }}" \
            "${{ steps.build.outcome }}" > .security-validation-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .security-validation-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record legacy security validation status"
            git push origin HEAD:agent/security-legacy-deps
          fi

      - name: Fail when validation did not pass
        if: always() && (steps.npm6.outcome != 'success' || steps.lock.outcome != 'success' || steps.install.outcome != 'success' || steps.tests.outcome != 'success' || steps.build.outcome != 'success')
        run: exit 1
