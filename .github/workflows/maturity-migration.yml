name: Apply product maturity migration

on:
  push:
    branches:
      - refactor/product-maturity-v2

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/product-maturity-v2
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Consolidate CSS layers
        run: node scripts/consolidate-css.mjs
      - name: Migrate translation imports
        run: node scripts/migrate-i18n-imports.mjs
      - name: Enrich demo decision data
        run: node scripts/enrich-demo-api.mjs
      - name: Refresh dependency lockfile
        run: npm install --package-lock-only --legacy-peer-deps --no-audit --no-fund
      - name: Install refreshed dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Rebuild CSS bundle
        run: npm run styles
      - name: Validate migrated architecture
        run: npm run quality
        env:
          REACT_APP_DEMO: 'true'
      - name: Commit deterministic migration output
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
          else
            git commit -m "Apply product maturity architecture migration"
            git push origin HEAD:refactor/product-maturity-v2
          fi
