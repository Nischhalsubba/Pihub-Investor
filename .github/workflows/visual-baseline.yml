name: Generate PiHub visual baselines

on:
  push:
    branches:
      - refactor/product-maturity-v2

permissions:
  contents: write

jobs:
  baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/product-maturity-v2
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run styles
      - run: npx playwright install --with-deps chromium
      - name: Capture canonical baselines
        run: npx playwright test e2e/visual-regression.spec.js --project=chromium-desktop --update-snapshots
        env:
          REACT_APP_DEMO: 'true'
      - name: Commit visual snapshots
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/e2e/visual-regression.spec.js-snapshots
          if git diff --cached --quiet; then
            echo "No visual baseline changes"
          else
            git commit -m "Add responsive visual regression baselines"
            git push origin HEAD:refactor/product-maturity-v2
          fi
