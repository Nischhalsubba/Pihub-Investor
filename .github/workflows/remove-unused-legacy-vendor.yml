name: Remove unused legacy vendor files

on:
  push:
    branches:
      - chore/remove-unused-legacy-vendor-2026-09-13

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[vendor-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-unused-legacy-vendor-2026-09-13
      - name: Verify legacy vendor files are unreferenced
        shell: bash
        run: |
          set -euo pipefail
          matches="$(grep -RInE 'jquery\.js|bootstrap\.js' app \
            --exclude='jquery.js' \
            --exclude='bootstrap.js' \
            --exclude-dir='node_modules' \
            --exclude-dir='.git' || true)"
          if [ -n "$matches" ]; then
            echo "Legacy vendor references found; refusing automatic deletion:"
            echo "$matches"
            exit 1
          fi
      - name: Remove unused legacy vendor files
        run: |
          rm -f app/public/assets/js/jquery.js app/public/assets/js/bootstrap.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app/public/assets/js/jquery.js app/public/assets/js/bootstrap.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: remove unused legacy vendor scripts [vendor-cleanup]"
          git push
