name: Validate PiHub Investor

on:
  push:
    branches:
      - main
      - develop
      - 'remediation/**'
      - 'stabilization/**'
      - 'feat/**'
      - 'fix/**'
      - 'refactor/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  investor-quality:
    name: Investor quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Architecture checks
        run: npm run check:styles && npm run check:i18n && npm run check:platform
      - name: Unit tests
        run: npm run test:unit
      - name: Production build
        run: npm run build
        env:
          REACT_APP_DEMO: 'true'
      - name: Bundle budget
        run: npm run check:bundle
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser smoke, visual and accessibility tests
        run: npm run test:e2e
        env:
          REACT_APP_DEMO: 'true'
      - name: Preserve Investor Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: investor-playwright-failure-${{ github.run_id }}
          path: |
            app/playwright-report/
            app/test-results/
          if-no-files-found: warn
          retention-days: 7
