name: One-time Investor security lock refresh

on:
  push:
    branches:
      - chore/security-ci-baseline
    paths:
      - '.github/workflows/refresh-investor-security-lock.yml'

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out security branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/security-ci-baseline
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Remove unused vulnerable translation dependency
        working-directory: app
        run: npm uninstall counterpart --legacy-peer-deps
      - name: Upgrade React Router alias to patched release
        working-directory: app
        run: npm install --legacy-peer-deps --save-exact 'react-router-dom-v6@npm:react-router-dom@6.30.6'
      - name: Verify production dependency audit
        working-directory: app
        run: npm audit --omit=dev --audit-level=high
      - name: Remove one-time workflow and commit resolved lockfile
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-investor-security-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/package.json app/package-lock.json .github/workflows/refresh-investor-security-lock.yml
          git diff --cached --quiet && exit 0
          git commit -m 'security: patch Investor runtime dependency advisories'
          git push origin HEAD:chore/security-ci-baseline
