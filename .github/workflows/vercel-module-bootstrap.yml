name: Bootstrap PiHub Vercel modules

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Create, link and deploy PiHub projects
    runs-on: ubuntu-latest
    env:
      VERCEL_TEAM_ID: team_HLWnL5pQNj3x8woHsjGhFRUB
      VERCEL_SCOPE: nischhalsubbas-projects
      VERCEL_CLI_VERSION: 59.3.0
      REPOSITORY: Nischhalsubba/Pihub-Investor
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require Vercel API token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not configured. Add a Vercel token with project-management permission as a GitHub Actions secret, then run this workflow once."
            exit 1
          fi

      - name: Create or repair independent Vercel projects
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail

          ensure_project() {
            project="$1"
            root_directory="$2"

            status="$(curl -sS -o /tmp/vercel-project.json -w '%{http_code}' \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects/$project?teamId=$VERCEL_TEAM_ID")"

            if [ "$status" = "404" ]; then
              echo "Creating $project from $root_directory"
              jq -n \
                --arg name "$project" \
                --arg root "$root_directory" \
                --arg repo "$REPOSITORY" \
                '{
                  name: $name,
                  framework: "vite",
                  gitRepository: { type: "github", repo: $repo },
                  rootDirectory: $root,
                  installCommand: "npm ci --legacy-peer-deps",
                  buildCommand: "npm run build",
                  outputDirectory: "dist",
                  publicSource: true,
                  enableAffectedProjectsDeployments: true
                }' > /tmp/vercel-project-body.json
              curl --fail-with-body -sS -X POST \
                -H "Authorization: Bearer $VERCEL_TOKEN" \
                -H "Content-Type: application/json" \
                "https://api.vercel.com/v11/projects?teamId=$VERCEL_TEAM_ID" \
                --data-binary @/tmp/vercel-project-body.json > /tmp/vercel-project-created.json
            elif [ "$status" != "200" ]; then
              cat /tmp/vercel-project.json || true
              echo "::error::Unable to inspect $project. Vercel returned HTTP $status."
              exit 1
            fi

            # Every independent module imports /packages outside its Root
            # Directory and must remain publicly reachable so the central PiHub
            # login can perform the cross-origin handoff. Vercel Authentication
            # on these apps blocks the product before PiHub auth can run.
            jq -n \
              --arg root "$root_directory" \
              '{
                framework: "vite",
                rootDirectory: $root,
                installCommand: "npm ci --legacy-peer-deps",
                buildCommand: "npm run build",
                outputDirectory: "dist",
                sourceFilesOutsideRootDirectory: true,
                enableAffectedProjectsDeployments: true,
                ssoProtection: null
              }' > /tmp/vercel-project-body.json
            curl --fail-with-body -sS -X PATCH \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v9/projects/$project?teamId=$VERCEL_TEAM_ID" \
              --data-binary @/tmp/vercel-project-body.json > /tmp/vercel-project-updated.json
          }

          ensure_project pihub-borrower apps/borrower
          ensure_project pihub-advisory apps/advisory
          ensure_project pihub-admin apps/admin
          ensure_project pihub-access apps/access

      - name: Configure Access production workspace links
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          cat > /tmp/access-env.json <<'JSON'
          [
            {"key":"VITE_INVESTOR_APP_URL","value":"https://pihub-investor.vercel.app","type":"plain","target":["production","preview"]},
            {"key":"VITE_BORROWER_APP_URL","value":"https://pihub-borrower-nischhalsubbas-projects.vercel.app","type":"plain","target":["production","preview"]},
            {"key":"VITE_ADVISORY_APP_URL","value":"https://pihub-advisory-nischhalsubbas-projects.vercel.app","type":"plain","target":["production","preview"]},
            {"key":"VITE_ADMIN_APP_URL","value":"https://pihub-admin-nischhalsubbas-projects.vercel.app","type":"plain","target":["production","preview"]}
          ]
          JSON
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v10/projects/pihub-access/env?upsert=true&teamId=$VERCEL_TEAM_ID" \
            --data-binary @/tmp/access-env.json > /tmp/access-env-result.json

      - name: Connect independent projects to GitHub and deploy main
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail

          deploy_project() {
            project="$1"
            echo "Connecting $project to GitHub"
            npx --yes "vercel@$VERCEL_CLI_VERSION" link --yes \
              --cwd . --project "$project" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
            npx --yes "vercel@$VERCEL_CLI_VERSION" git connect --yes \
              --cwd . --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

            # Trigger a Git-source production build. Vercel clones the complete
            # repository and applies the project's Root Directory, which is the
            # safe monorepo path for apps that import shared /packages.
            jq -n \
              --arg name "$project" \
              '{
                name: $name,
                project: $name,
                target: "production",
                gitSource: {
                  type: "github",
                  org: "Nischhalsubba",
                  repo: "Pihub-Investor",
                  ref: "main"
                }
              }' > /tmp/vercel-deploy-body.json

            response="$(curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v13/deployments?teamId=$VERCEL_TEAM_ID" \
              --data-binary @/tmp/vercel-deploy-body.json)"
            deployment_id="$(printf '%s' "$response" | jq -r '.id // empty')"
            deployment_url="$(printf '%s' "$response" | jq -r '.url // empty')"
            if [ -z "$deployment_id" ]; then
              printf '%s\n' "$response"
              echo "::error::$project deployment did not return a deployment id."
              exit 1
            fi
            echo "$project deployment $deployment_id -> $deployment_url"

            for attempt in $(seq 1 120); do
              details="$(curl --fail-with-body -sS \
                -H "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v13/deployments/$deployment_id?teamId=$VERCEL_TEAM_ID&withGitRepoInfo=true")"
              state="$(printf '%s' "$details" | jq -r '.readyState // .status // "UNKNOWN"')"
              case "$state" in
                READY)
                  echo "$project production deployment is READY."
                  return 0
                  ;;
                ERROR|CANCELED)
                  printf '%s\n' "$details"
                  echo "::error::$project production deployment ended in $state."
                  exit 1
                  ;;
                *)
                  sleep 5
                  ;;
              esac
            done

            echo "::error::$project production deployment did not become READY within 10 minutes."
            exit 1
          }

          # Investor is already Git-connected at the repository root and is
          # automatically deployed on main. Do not spend another build on it.
          deploy_project pihub-borrower
          deploy_project pihub-advisory
          deploy_project pihub-admin
          deploy_project pihub-access

      - name: Verify project roots, shared source access and public handoff state
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail

          verify_project() {
            project="$1"
            expected_root="$2"
            expected_outside="$3"
            expected_sso="$4"
            payload="$(curl --fail-with-body -sS \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects/$project?teamId=$VERCEL_TEAM_ID")"
            actual_root="$(printf '%s' "$payload" | jq -r '.rootDirectory // "."')"
            actual_outside="$(printf '%s' "$payload" | jq -r '.sourceFilesOutsideRootDirectory // false')"
            actual_sso="$(printf '%s' "$payload" | jq -r 'if .ssoProtection == null then "false" else "true" end')"

            if [ "$actual_root" != "$expected_root" ]; then
              echo "::error::$project rootDirectory is '$actual_root', expected '$expected_root'."
              exit 1
            fi
            if [ "$actual_outside" != "$expected_outside" ]; then
              echo "::error::$project sourceFilesOutsideRootDirectory is '$actual_outside', expected '$expected_outside'."
              exit 1
            fi
            if [ "$actual_sso" != "$expected_sso" ]; then
              echo "::error::$project Vercel Authentication state is '$actual_sso', expected '$expected_sso'."
              exit 1
            fi
            echo "$project -> root=$actual_root outsideRoot=$actual_outside vercelAuth=$actual_sso"
          }

          verify_project pihub-investor . false false
          verify_project pihub-borrower apps/borrower true false
          verify_project pihub-advisory apps/advisory true false
          verify_project pihub-admin apps/admin true false
          verify_project pihub-access apps/access true false
