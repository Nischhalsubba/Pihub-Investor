version: '3'
services:
  credittech-frontend-react:
    build: .
    restart: always
    ports:
      - '5000:5000'
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL}
    networks:
      - credittech
    labels:
      - traefik.backend=credittech-frontend-react
      - traefik.normal.frontend.rule=Host:credittech.diagonal.solutions,stage.investor.credittech.diagonal.solutions
      - traefik.docker.network=credittech
      - traefik.port=5000

networks:
    credittech:
      external: true
